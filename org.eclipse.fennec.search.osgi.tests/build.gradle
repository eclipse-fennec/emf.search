
// The resolved closure goes to a generated file rather than into the committed bndrun: the
// resolver rewrites the whole file, and a build that dirties the working tree on every run
// is a build nobody trusts. `testOSGi` launches that generated file.
def resolveTask = tasks.named("resolve.test") {
	outputBndrun = layout.buildDirectory.file("test.bndrun")
	// Never up to date (#35). Gradle cannot see that a *changed bundle* invalidates a
	// resolution: it considers the task current across commits that gave the core new
	// imports, and the stale closure then fails to start the test bundle — which used to be
	// a silent green. Resolving takes seconds; being wrong about it cost a release cycle.
	outputs.upToDateWhen { false }
}

tasks.named("testOSGi") {
	bndrun = resolveTask.flatMap { it.outputBndrun }
}

// The committed `-runbundles` is a convenience copy for launching this bndrun from bndtools,
// and a copy that may lie is worth less than no copy (#35 — it went stale once already). What
// has to match is the *set of bundles*: which ones the runtime needs is the thing that drifts
// when a bundle gains an import, and it is the same everywhere. Versions deliberately are not
// compared — a release build resolves the workspace's own bundles to a timestamped version
// while the committed file says `snapshot`, and failing on that would gate releases on a
// spelling.
tasks.register("checkRunbundles") {
	dependsOn resolveTask
	def committed = layout.projectDirectory.file("test.bndrun")
	def resolved = resolveTask.flatMap { it.outputBndrun }
	inputs.file(committed)
	inputs.file(resolved)
	outputs.upToDateWhen { false }
	doLast {
		// Read the block by bnd's own rule — a line ending in a backslash continues — rather
		// than by a regex over the text. A blank line left behind by a hand edit is then
		// whitespace, not the end of the list, which is what a stale copy usually looks like.
		def namesOf = { file ->
			def names = new TreeSet<String>()
			boolean inside = false
			file.asFile.eachLine { line ->
				def entry = line.trim()
				if (entry.startsWith("-runbundles:")) {
					inside = true
					entry = entry.substring("-runbundles:".length()).trim()
				} else if (!inside) {
					return
				} else if (entry.startsWith("#")) {
					return
				}
				boolean continues = entry.endsWith("\\")
				entry = entry.replaceAll(/\\$/, '').trim().replaceAll(/,$/, '').trim()
				if (entry) {
					names << entry.split(/;/)[0].trim()
					inside = continues
				}
			}
			if (names.isEmpty()) {
				throw new GradleException("No -runbundles found in ${file} — the comparison would "
						+ "have compared nothing with nothing.")
			}
			names
		}
		def here = namesOf(committed)
		def there = namesOf(resolved.get())
		if (here != there) {
			def missing = there - here
			def extra = here - there
			throw new GradleException("The -runbundles in test.bndrun is not the set the resolver "
					+ "produces, so the committed list lies about what testOSGi runs."
					+ (missing ? " Missing: ${missing.join(', ')}." : "")
					+ (extra ? " No longer needed: ${extra.join(', ')}." : "")
					+ " Copy the -runbundles block from ${resolved.get().asFile} into "
					+ "${committed.asFile} and commit it.")
		}
	}
}

tasks.named("check").configure { dependsOn "checkRunbundles" }
