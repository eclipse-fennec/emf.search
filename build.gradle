plugins {
  id "org.sonarqube" version "6.2.0.5505"
  id 'jacoco'
  id 'java'
}

// We need to define a repository for the root project, otherwise Jacoco dependencies cannot be resolved
repositories {
  mavenCentral()
}

subprojects {

    //  Apply plugin: 'jacoco' to all submodules JUnit tests are generated as generated/jacoco/test.exec
    apply plugin: 'jacoco'
    apply plugin: 'java'
    // We need to define a repository, otherwise Jacoco dependencies cannot be resolved
    repositories {
        mavenCentral()
    }
    // Allow gradle to enable JUnit support in submodules
    // Exclude @Tag("perf") (slow) and @Tag("remote") (needs internet) tests from normal
    // builds — run via the perfTest / remoteTest tasks.
    test {
        useJUnitPlatform {
            excludeTags 'perf', 'remote'
        }
    }

    // Dedicated task for the slow scaling tests (@Tag("perf"), kept out of the fast build).
    // Their STRUCTURAL assertions (constant SQL statement counts at scale — deterministic) DO gate;
    // timing is only logged, so this task is safe to fail the build on a real regression.
    tasks.register('perfTest', Test) {
        useJUnitPlatform {
            includeTags 'perf'
        }
    }

    // Dedicated task for tests against PUBLIC endpoints (@Tag("remote")): they validate the
    // service-client design against real services but depend on internet + third-party uptime,
    // so they never gate the normal build. Run explicitly: ./gradlew remoteTest
    tasks.register('remoteTest', Test) {
        useJUnitPlatform {
            includeTags 'remote'
        }
    }

    // Add JUnit dependencies for modules that have Gradle tests
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testImplementation 'org.junit.platform:junit-platform-launcher:6.1.2'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.21.0'
        testImplementation 'org.assertj:assertj-core:3.27.7'
    }

    // Coverage floor: a catastrophic-regression tripwire (e.g. a bundle's tests deleted) wired
    // into `check`. Conservative baseline of 30% instructions on the hand-written code of the
    // library bundles that carry plain-JUnit tests — generated code and test-only/OSGi-covered
    // bundles are out of scope. Ratchet upward as coverage is deliberately raised.
    // Add each utility's core bundle here as it gains plain-JUnit tests.
    def coverageFloorBundles = [
           
    ]
    afterEvaluate {
        if (project.name in coverageFloorBundles) {
            tasks.named('jacocoTestCoverageVerification') {
                // exclude generated code (ANTLR parser, EMF src-gen models/profiles)
                def generated = ['**/antlr/**', '**/profile/**', 'org/open/oasis/**']
                classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: generated)
                }))
                violationRules {
                    rule {
                        limit {
                            counter = 'INSTRUCTION'
                            value = 'COVEREDRATIO'
                            minimum = 0.30
                        }
                    }
                }
            }
            tasks.named('check').configure { dependsOn 'jacocoTestCoverageVerification' }
        }
    }

}


